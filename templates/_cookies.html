<div class="cookie-bar" id="cookieBar" hidden>
  <div class="container cookie-bar-inner">
    <p class="cookie-bar-text" data-i18n="cookie.text">
      Tento web používá cookies třetích stran pro Google Maps (interaktivní mapa) a Google Analytics (anonymní statistiky návštěvnosti).
    </p>
    <div class="cookie-bar-btns">
      <button class="btn btn-primary"   id="cookieAccept"  data-i18n="cookie.accept">Přijmout</button>
      <button class="btn cookie-btn-decline" id="cookieDecline" data-i18n="cookie.decline">Odmítnout</button>
    </div>
  </div>
</div>
